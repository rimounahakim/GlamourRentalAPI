spring.application.name=GlamourRentalAPI
server.port=8081

# Jag använder H2 för att spara information om klänningar och personer.
spring.datasource.url=jdbc:h2:mem:glamourdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jag använder Swagger för att se och testa mina API-anrop.
springdoc.swagger-ui.path=/swagger-ui.html
